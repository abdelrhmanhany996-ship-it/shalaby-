<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#14203b">
<title>تقييم تجربتك | شلبي</title>
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
:root{--navy:#14203b;--red:#c8232b;--ink:#111a2c;--muted:#5b677e;--line:#dde3ee;--bg:#f2f4f9}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Arabic',"Segoe UI",Tahoma,sans-serif;line-height:1.7}
.top{background:linear-gradient(135deg,#0e1730,var(--navy));color:#fff;padding:22px 20px 26px;text-align:center;border-bottom:3px solid var(--red)}
.top b{display:inline-block;background:var(--red);padding:2px 18px;border-radius:4px;font-size:22px}
.top small{display:block;margin-top:6px;opacity:.8}
main{max-width:520px;margin:0 auto;padding:18px 16px 40px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:14px;box-shadow:0 6px 24px rgba(20,32,59,.06)}
h1{font-size:20px;margin:0 0 4px}
p{margin:.2rem 0;color:var(--muted)}
.q{margin-top:18px}
.q>label,.q>span{display:block;font-weight:700;margin-bottom:6px}
.stars{display:flex;gap:6px;direction:ltr;justify-content:flex-end}
.stars button{background:none;border:none;font-size:34px;line-height:1;cursor:pointer;color:#cfd6e4;padding:2px;transition:transform .12s}
.stars button.on{color:#f5a623}
.stars button:active{transform:scale(1.2)}
.stars.small button{font-size:24px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px}
.row span{font-size:14px}
.yn{display:flex;gap:8px}
.yn button{flex:1;padding:10px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font:inherit;cursor:pointer}
.yn button.on{border-color:var(--red);background:#fbeceb;color:var(--red);font-weight:700}
textarea{width:100%;min-height:110px;padding:12px;border-radius:14px;border:1.5px solid var(--line);font:inherit;resize:vertical}
input[type=text],input[type=tel],input:not([type]){width:100%;padding:12px;margin-top:8px;border-radius:14px;border:1.5px solid var(--line);font:inherit}
input:focus{outline:none;border-color:var(--red);box-shadow:0 0 0 3px rgba(200,35,43,.12)}
.hint{margin:0 0 4px;color:var(--muted,#6b7280);font-size:13px;line-height:1.7}
[hidden]{display:none!important}
textarea:focus{outline:none;border-color:var(--red);box-shadow:0 0 0 3px rgba(200,35,43,.12)}
.chk{display:flex;gap:8px;align-items:flex-start;margin-top:12px;font-size:14px}
.chk input{margin-top:5px;width:18px;height:18px;accent-color:var(--red)}
.send{width:100%;margin-top:18px;padding:14px;border:none;border-radius:14px;background:var(--red);color:#fff;font:inherit;font-weight:700;font-size:17px;cursor:pointer;box-shadow:0 8px 18px rgba(200,35,43,.3)}
.send:disabled{opacity:.5;cursor:not-allowed}
.msg{text-align:center;padding:36px 20px}
.msg .big{font-size:54px}
.err{color:var(--red);font-size:14px;margin-top:8px;min-height:20px}
</style>
</head>
<body>
<div class="top"><b>شلبي</b><small>إدارة المبيعات</small></div>
<main id="app"><div class="card msg"><p>لحظة من فضلك…</p></div></main>
<script src="/review/review.js"></script>
</body>
</html>
