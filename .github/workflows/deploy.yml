name: CI & Deploy

# main -> https://shalaby.engsaber.space      (production)
# dev  -> https://dev-shalaby.engsaber.space  (development / staging)
# test -> https://test-shalaby.engsaber.space    (testing, separate Firebase project shalaby-test)
# Promotion order: test -> dev -> main. dev deploys only when its code is identical to test; main only when identical to dev.
# main also waits for approval on the 'production' environment (set required reviewers in GitHub).
# Pull requests only run the checks (lint, tests, build); nothing is deployed.

on:
  push:
    branches: [main, dev, test]
  pull_request:
    branches: [main, dev, test]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run test
      - run: bun run build
        env:
          VITE_APP_ENV: ${{ github.ref_name == 'test' && 'test' || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          include-hidden-files: true
          retention-days: 7

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/test')
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || github.ref_name == 'test' && 'test' || 'development' }}
    env:
      # Folder of each subdomain on Hostinger, relative to the FTP account root.
      SERVER_DIR_MAIN: domains/engsaber.space/public_html/shalaby-prod-site/
      SERVER_DIR_DEV: domains/engsaber.space/public_html/shalaby-dev-site/
      SERVER_DIR_TEST: domains/engsaber.space/public_html/shalaby-test-site/
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Promotion gate (test -> dev -> main)
        run: |
          case "$GITHUB_REF_NAME" in
            dev)  prev=test ;;
            main) prev=dev ;;
            *)    exit 0 ;;
          esac
          git fetch origin "$prev"
          if ! git diff --quiet "origin/$prev" HEAD -- . ':!.github'; then
            echo "::error::$GITHUB_REF_NAME can only be deployed after the same code is deployed to $prev. Merge $prev first."
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Point the PHP helpers at this environment's Firebase project
        # api/ai.php and api/admin.php carry the project id as a constant. Set the repository variable
        # FIREBASE_PROJECT_TEST / _DEV / _MAIN to the environment's project id; when unset nothing changes.
        env:
          PROJECT_ID: ${{ github.ref_name == 'main' && vars.FIREBASE_PROJECT_MAIN || github.ref_name == 'test' && vars.FIREBASE_PROJECT_TEST || vars.FIREBASE_PROJECT_DEV }}
        run: |
          if [ -n "$PROJECT_ID" ]; then
            sed -i "s/const FIREBASE_PROJECT_ID = '[^']*';/const FIREBASE_PROJECT_ID = '$PROJECT_ID';/" dist/api/ai.php dist/api/admin.php
          fi
      - name: Write AI keys from GitHub Secrets
        # api/ai.php reads crm-ai-secrets.php from a folder OUTSIDE the web root. The file is generated here from the
        # repository secrets ANTHROPIC_API_KEY (Claude) and optionally GEMINI_API_KEY (voice notes only), so the keys
        # never live in the repo. When ANTHROPIC_API_KEY is unset nothing is uploaded and any file already on the server is kept.
        id: aikeys
        env:
          CLAUDE_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$CLAUDE_KEY" ]; then
            echo "ANTHROPIC_API_KEY is not set; leaving the server's crm-ai-secrets.php untouched."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p ai-secrets
          php -r '
            $cfg = ["claude_key" => getenv("CLAUDE_KEY")];
            if (getenv("GEMINI_KEY") !== "" && getenv("GEMINI_KEY") !== false) $cfg["gemini_key"] = getenv("GEMINI_KEY");
            file_put_contents("ai-secrets/crm-ai-secrets.php", "<?php\nreturn " . var_export($cfg, true) . ";\n");
          '
          echo "enabled=true" >> "$GITHUB_OUTPUT"
      - name: Upload AI keys (outside the web root)
        if: steps.aikeys.outputs.enabled == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./ai-secrets/
          # api/ai.php finds the file three levels above its own folder: domains/engsaber.space/, next to public_html.
          server-dir: domains/engsaber.space/
          state-name: .ftp-deploy-sync-state-ai-secrets.json
      - name: Deploy over FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ${{ github.ref_name == 'main' && env.SERVER_DIR_MAIN || github.ref_name == 'test' && env.SERVER_DIR_TEST || env.SERVER_DIR_DEV }}
