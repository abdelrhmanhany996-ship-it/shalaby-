<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#c8232b" />
    <meta name="color-scheme" content="light dark" />
    <title>شلبي · الاتصال بالإنترنت</title>
    <link rel="icon" href="/icons/favicon-32.png" />
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f7f6f3;
        color: #242422;
        font-family: "IBM Plex Sans Arabic", Arial, sans-serif;
        line-height: 1.8;
      }
      main {
        width: min(460px, 100%);
        padding: 36px;
        background: #fff;
        border: 1px solid #e6e3dd;
        border-radius: 16px;
      }
      img {
        width: 80px;
        height: 80px;
        border-radius: 16px;
      }
      h1 {
        font-size: 24px;
        line-height: 1.6;
        margin: 22px 0 10px;
      }
      p {
        color: #65645e;
      }
      button {
        font: inherit;
        background: #c8232b;
        color: #fff;
        border: 0;
        border-radius: 8px;
        padding: 10px 20px;
        cursor: pointer;
        margin-top: 12px;
        min-height: 44px;
      }
      button:focus-visible {
        outline: 3px solid #c8232b;
        outline-offset: 4px;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #171716;
          color: #f0efea;
        }
        main {
          background: #232322;
          border-color: #393937;
        }
        p {
          color: #b3b2ab;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="شلبي" />
      <h1>محتاجين اتصال بالإنترنت</h1>
      <p>اتأكد من الاتصال، وبعدها افتح مساحة عملك من جديد.</p>
      <p>بيانات العملاء والصلاحيات تحتاج الاتصال عند فتح التطبيق.</p>
      <button type="button" onclick="window.location.reload()">
        حاول تاني
      </button>
    </main>
  </body>
</html>
